<!DOCTYPE html>
<html>
<head>
    <title>Parcel Cost Estimator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            text-align: center;
            color: #1565c0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 5px;
            display: none;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Parcel Cost Estimator</h1>

    <label>Sender Name:</label>
    <input type="text" id="sender" placeholder="Enter sender name">

    <label>Receiver Name:</label>
    <input type="text" id="receiver" placeholder="Enter receiver name">

    <label>Parcel Weight (KG):</label>
    <input type="number" id="weight" placeholder="Enter parcel weight" min="0.1" step="0.1">

    <label>Delivery Type:</label>
    <select id="delivery">
        <option value="standard">Standard Delivery</option>
        <option value="express">Express Delivery</option>
        <option value="same">Same Day Delivery</option>
    </select>

    <button onclick="calculateCost()">Calculate Cost</button>

    <div id="result"></div>

</div>

<script>

function calculateCost() {

    let sender = document.getElementById("sender").value.trim();
    let receiver = document.getElementById("receiver").value.trim();
    let weight = parseFloat(document.getElementById("weight").value);
    let delivery = document.getElementById("delivery").value;

    if (sender === "" || receiver === "" ||
        !Number.isFinite(weight) || weight <= 0) {

        alert("Please enter all details correctly!");
        return;
    }

    let rate;
    let deliveryCharge;

    if (delivery === "standard") {
        rate = 40;
        deliveryCharge = 20;
    }
    else if (delivery === "express") {
        rate = 70;
        deliveryCharge = 50;
    }
    else {
        rate = 100;
        deliveryCharge = 100;
    }

    let totalCost = (weight * rate) + deliveryCharge;

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML = `
        <h3>Parcel Cost Details</h3>
        Sender: ${sender}<br>
        Receiver: ${receiver}<br>
        Weight: ${weight} KG<br>
        Delivery Type: ${delivery.toUpperCase()}<br>
        Rate: ₹${rate} per KG<br>
        Delivery Charge: ₹${deliveryCharge}<br>
        <hr>
        <h3>Total Cost: ₹${totalCost.toFixed(2)}</h3>
    `;
}

</script>

</body>
</html>
